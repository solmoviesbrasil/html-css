<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização vertical de caixas</title>
    <style>
        #container{
            position: relative;
            background-color: purple;
            height: 96vh;
            padding: 20px;
        }
        #conteudo{
            position: absolute;
            background-color: blue;    
            left: 50%;     
            top: 50%;
            transform: translate(-50%, -50%);
        }
        #conteudo img{
            width: 50px;
            height: 50px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <section id="container">
        <article id="conteudo">
            <img src="imagens/pattern002.png" alt="">
        </article>
    </section>
</body>
</html>
